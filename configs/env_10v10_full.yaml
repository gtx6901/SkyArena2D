map:
  width: 3000
  height: 4000

teams:
  red_fighters: 10
  blue_fighters: 10
  red_detectors: 0
  blue_detectors: 0

max_steps: 1200
dt: 1.0

dynamics:
  turn_mode: instant
  boundary_mode: clamp
  default_fighter_speed: 5.0
  default_detector_speed: 1.5

spawn:
  mode: fixed_scaled
  red_x_ratio: 0.18
  blue_x_ratio: 0.82
  y_min_ratio: 0.12
  y_max_ratio: 0.88
  jitter: 10.0

radar:
  enabled: true
  freq_count: 10
  fighter_range: 300.0
  fighter_fov_deg: 120.0
  detector_range: 540.0
  detector_fov_deg: 360.0

jamming:
  enabled: true
  mode: probabilistic
  range: 320.0
  spot_block_prob: 0.75
  barrage_block_prob: 0.4

passive_detection:
  enabled: true
  detect_radar_on: true
  detect_jammer_on: true
  range: 500.0

weapon:
  long_range: 220.0
  short_range: 120.0
  long_hit_prob: 0.4
  short_hit_prob: 0.75
  long_ammo: 2
  short_ammo: 4
  hit_prob_enable: true
  attack_effect_delay: 2
  simultaneous_resolution: true
  allow_passive_fire: false

reward:
  valid_fire: 0.02
  invalid_fire: -0.05
  kill_fighter: 1.0
  kill_detector: 0.5
  loss_fighter: -1.0
  loss_detector: -0.5
  win: 5.0
  lose: -5.0
  draw: 0.0
  keep_alive_step: 0.0

render:
  width: 900
  height: 1200
  pixel_style: true
  debug_overlay: true
  show_radar: true
  show_jamming: true
  show_visible_edges: false
  show_fireable_edges: true
  show_target_allocations: true

reward_modules:
  kill_loss:
    enabled: true
  win_loss:
    enabled: true
    win: 5.0
    lose: -5.0
    draw: 0.0
  valid_fire:
    enabled: true
    coef: 0.02
    only_when_opportunity: false
  invalid_fire:
    enabled: true
    penalty: -0.05
  fire_execution:
    enabled: false
    coef: 0.01
  selected_exchange:
    enabled: false
    coef: 0.05
