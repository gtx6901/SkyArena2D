train:
  experiment_name: stage0_no_attack_movement_v3
  train_dir: train_dir/skyarena_mappo_train
  seed: 42
  device: cuda
  num_envs: 2
  rollout_steps: 256
  total_env_steps: 300000
  learning_rate: 0.0002
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  entropy_coef: 0.015
  value_coef: 0.5
  ppo_epochs: 3
  max_grad_norm: 0.5
  save_interval: 100000
  eval_interval: 50000
  resume: false
  init_checkpoint: ""

env:
  config_path: configs/env_10v10_full.yaml
  blue_rule: no_attack_rule
  candidate_slots: 6
  search_goal_grid_size: 8
  goal_hold_steps: 50
  goal_reach_radius: 90.0
  track_memory_steps: 10
  use_jammer_strategy: true
  radar_freq_count: 10
  radar_cycle_interval: 8
  radar_stride: 3
  jammer_cycle_interval: 6
  jammer_stride: 7
  jammer_barrage_prob: 0.0
  max_jammers_per_side: 3

model:
  semantic_map_size: 100
  trunk_dim: 192
  entity_embed_dim: 96
  map_embed_dim: 96
  current_goal_embed_dim: 32
  agent_id_embed_dim: 16
  region_embed_dim: 64
  lstm_hidden_dim: 192
  critic_hidden_dim: 256

logging:
  tensorboard: true

evaluation:
  policy_eval_interval: 50000
  policy_eval_episodes: 5
  gui_eval_enabled: true
  gui_eval_interval: 100000
  gui_eval_episodes: 15
  gui_eval_max_steps: 1200
  gui_eval_render_mode: human
  gui_eval_human: true
  gui_eval_save_video: false
  gui_eval_save_frames: false
  gui_eval_render_every: 20
  gui_eval_dir: gui_eval
  gui_eval_deterministic: true
