[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skyarena2d"
version = "0.1.0"
description = "Transparent, configurable 2D multi-agent air combat environment"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "SkyArena2D Contributors" }
]
dependencies = [
  "numpy>=1.24",
  "pygame-ce>=2.5.2",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "gymnasium>=0.29",
  "pettingzoo>=1.24",
  "rich>=13.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5"
]
torch = [
  "torch>=2.2"
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["skyarena2d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E203", "E402", "E501"]
